# Local run of the full image (frontend + API on one port), like Render does.
#   docker compose up --build   ->   http://localhost:8000
#
# For backend-only iteration with autoreload, run uvicorn directly instead:
#   cd backend && uvicorn app.main:app --reload --port 8000
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend/secrets:/app/secrets:ro
      - card2lead-data:/app/data
    environment:
      # keep SQLite on the named volume so it survives `docker compose down`
      DATABASE_URL: sqlite:///./data/app.db

volumes:
  card2lead-data:
